<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Redirect Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin: 0 0 30px 0;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        input:focus {
            outline: none;
            border-color: white;
            background: rgba(255, 255, 255, 0.15);
        }
        button {
            width: 100%;
            padding: 14px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95em;
        }
        .status.success {
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
        }
        .status.info {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid #3b82f6;
        }
        .step {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-size: 0.9em;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login & Redirect Test</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required />
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            
            <button type="submit" id="loginBtn">Sign In & Test Redirect</button>
        </form>
        
        <div id="status"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cooyzjomljshbudjnnkf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvb3l6am9tbGpzaGJ1ZGpubmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2ODgyMjAsImV4cCI6MjA3NjI2NDIyMH0.dmeXTX2p_UWXOoPyl9pKIQZ8GLjBA6KWXPaeZFww7cs';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage,
            }
        });

        const form = document.getElementById('loginForm');
        const statusDiv = document.getElementById('status');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span> Signing in...';
            
            try {
                statusDiv.innerHTML = '<div class="status info"><strong>Step 1:</strong> Attempting login...</div>';
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    throw error;
                }
                
                statusDiv.innerHTML = `
                    <div class="status success">
                        <strong>✅ Step 1 Complete:</strong> Login successful!
                        <div class="step">User: ${data.user.email}</div>
                        <div class="step">Session: ${data.session ? 'Created' : 'Missing'}</div>
                    </div>
                `;
                
                // Wait a moment for session to be saved
                await new Promise(resolve => setTimeout(resolve, 200));
                
                statusDiv.innerHTML += `
                    <div class="status info">
                        <strong>Step 2:</strong> Checking session storage...
                        <div class="step">LocalStorage items: ${localStorage.length}</div>
                        <div class="step">Auth token: ${localStorage.getItem('sb-cooyzjomljshbudjnnkf-auth-token') ? 'Found ✅' : 'Missing ❌'}</div>
                    </div>
                `;
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                statusDiv.innerHTML += `
                    <div class="status success">
                        <strong>✅ Step 3:</strong> Redirecting to dashboard in 2 seconds...
                    </div>
                `;
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Redirect
                window.location.href = '/dashboard';
                
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        <strong>❌ Login Failed</strong>
                        <div class="step">${error.message}</div>
                    </div>
                `;
                loginBtn.disabled = false;
                loginBtn.textContent = 'Try Again';
            }
        });
    </script>
</body>
</html>
