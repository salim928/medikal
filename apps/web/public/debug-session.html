<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Debug</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { color: #06b6d4; }
    .box {
      background: #1e293b;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    button {
      background: #06b6d4;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #0891b2; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    pre {
      background: #0f172a;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🔍 Session Debugger</h1>
  
  <div class="box">
    <h2>Current Session Status</h2>
    <div id="status">Checking...</div>
  </div>

  <div class="box">
    <h2>Actions</h2>
    <button onclick="checkSession()">Refresh Session</button>
    <button onclick="goToDashboard()">Go to Dashboard</button>
    <button onclick="goToLogin()">Go to Login</button>
    <button onclick="testAuth()">Test Auth Flow</button>
  </div>

  <div class="box">
    <h2>Debug Info</h2>
    <pre id="debug">Click "Refresh Session" to load</pre>
  </div>

  <script>
    const SUPABASE_URL = 'https://cooyzjomljshbudjnnkf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvb3l6am9tbGpzaGJ1ZGpubmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2ODgyMjAsImV4cCI6MjA3NjI2NDIyMH0.dmeXTX2p_UWXOoPyl9pKIQZ8GLjBA6KWXPaeZFww7cs';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage,
        flowType: 'pkce',
      }
    });

    async function checkSession() {
      const { data: { session }, error } = await supabase.auth.getSession();
      
      const statusDiv = document.getElementById('status');
      const debugDiv = document.getElementById('debug');
      
      if (error) {
        statusDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
        debugDiv.textContent = JSON.stringify(error, null, 2);
        return;
      }
      
      if (session?.user) {
        statusDiv.innerHTML = `
          <span class="success">✅ Logged in as: ${session.user.email}</span><br>
          <small>Role: ${session.user.user_metadata?.role || 'unknown'}</small><br>
          <small>Session expires: ${new Date(session.expires_at * 1000).toLocaleString()}</small>
        `;
        
        debugDiv.textContent = JSON.stringify({
          user: {
            id: session.user.id,
            email: session.user.email,
            role: session.user.user_metadata?.role,
            email_confirmed: !!session.user.email_confirmed_at
          },
          session: {
            expires_at: new Date(session.expires_at * 1000).toLocaleString(),
            access_token_preview: session.access_token.substring(0, 50) + '...'
          },
          localStorage_keys: Object.keys(localStorage).filter(k => k.includes('sb-'))
        }, null, 2);
      } else {
        statusDiv.innerHTML = '<span class="error">❌ Not logged in</span>';
        debugDiv.textContent = 'No active session';
      }
    }

    function goToDashboard() {
      console.log('Navigating to dashboard...');
      window.location.href = '/dashboard';
    }

    function goToLogin() {
      console.log('Navigating to login...');
      window.location.href = '/login';
    }

    async function testAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        alert('Not logged in! Go to login page first.');
        return;
      }
      
      console.log('Testing auth flow...');
      console.log('Current session:', session.user.email);
      
      // Try to access dashboard
      console.log('Attempting to navigate to dashboard...');
      window.location.href = '/dashboard';
    }

    // Auto-check on load
    checkSession();

    // Listen for auth changes
    supabase.auth.onAuthStateChange((event, session) => {
      console.log('Auth state changed:', event);
      checkSession();
    });
  </script>
</body>
</html>
